services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voicelab}
      POSTGRES_USER: ${POSTGRES_USER:-voicelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VOICELAB_DATABASE_URL: ${VOICELAB_DATABASE_URL:?Set VOICELAB_DATABASE_URL in .env}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  voice-agent:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VOICELAB_DATABASE_URL: ${VOICELAB_DATABASE_URL:?Set VOICELAB_DATABASE_URL in .env}
    command: python -m app.voice.livekit_agent start
    depends_on:
      web:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
